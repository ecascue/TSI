<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno migratorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap" rel="stylesheet">
<!-- Enlace a tu archivo CSS -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Secciones">
    <div class="marca"><span class="logo">CM</span><span>Cuaderno migratorio<small>Seguimiento de casos</small></span></div>
    <button data-a="nav" data-v="inicio"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
    <button data-a="nav" data-v="casos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>Casos</span></button>
    <button data-a="nav" data-v="recursos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Recursos</span></button>
    <button data-a="nav" data-v="memoria"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Memoria</span></button>
    <button data-a="nav" data-v="copias"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span>Copias</span></button>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<button id="fab" class="btn primario fab" data-a="nuevo" hidden>+ Nuevo caso</button>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Enlace a tu archivo JS -->
<script src="app.js"></script>
</body>
</html>
